const rnd  = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ri   = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const ease  = t => 1 - Math.pow(1 - t, 3);
const easeB = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0)/4294967295; }
function nz(s,i){ return hash(s+'#'+i); }              // детерминированный шум
function wob(s,t,a){ return Math.sin(t*1.7+s)*a + Math.sin(t*3.1+s*2)*a*.45; }
function rgba(r,g,b,a){ return 'rgba('+r+','+g+','+b+','+a+')'; }

/* ---------- 2. ЗВУК: СИНТЕЗИРОВАННЫЙ КОШМАР ---------- */
const A = {
  ok:false, on:true, ctx:null, mg:null, lp:null, det:0,
  boot(){
    if (this.ctx) return;
    try { const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C(); }
    catch(e){ return; }
    this.mg = this.ctx.createGain(); this.mg.gain.value = this.on ? 0.5 : 0;
    this.mg.connect(this.ctx.destination);
    // вечный гул палаты
    this.lp = this.ctx.createBiquadFilter(); this.lp.type='lowpass'; this.lp.frequency.value = 240; this.lp.Q.value = 6;
    const g = this.ctx.createGain(); g.gain.value = 0.075;
    this.lp.connect(g); g.connect(this.mg);
    [43.5, 44.2, 65.4].forEach((f,i)=>{
      const o = this.ctx.createOscillator(); o.type = i===2 ? 'triangle' : 'sawtooth';
      o.frequency.value = f; o.detune.value = i*7; o.connect(this.lp); o.start();
    });
    const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lg = this.ctx.createGain(); lg.gain.value = 90;
    lfo.connect(lg); lg.connect(this.lp.frequency); lfo.start();
    this.ok = true;
  },
  set(on){ this.on = on; if (this.mg) this.mg.gain.value = on ? 0.5 : 0; },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },
  tone(f, d, type, vol, slide){
    if (!this.ok || !this.on) return;
    const t = this.now(), o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(Math.max(20, f), t);
    o.detune.value = this.det;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.mg); o.start(t); o.stop(t + d + 0.06);
  },
  noise(d, vol, fq, type){
    if (!this.ok || !this.on) return;
    const t = this.now(), len = Math.max(1, Math.floor(this.ctx.sampleRate * d));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), dt = buf.getChannelData(0);
    for (let i=0;i<len;i++) dt[i] = (Math.random()*2-1) * (1 - i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bq = this.ctx.createBiquadFilter(); bq.type = type || 'bandpass';
    bq.frequency.value = fq || 1200; bq.Q.value = 1.2;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(bq); bq.connect(g); g.connect(this.mg); src.start(t);
  },
  card(){ this.noise(0.09, 0.22, 2600, 'highpass'); this.tone(rnd(500,900), 0.05, 'square', 0.05); },
  flip(){ this.noise(0.13, 0.18, 1500); this.tone(320, 0.09, 'triangle', 0.09, 180); },
  tooth(){ this.tone(rnd(1400,2000), 0.06, 'square', 0.05); this.noise(0.05, 0.1, 4200, 'highpass'); },
  chip(){ for (let i=0;i<4;i++) setTimeout(()=>this.tooth(), i*45); },
  clack(){ this.tone(180, 0.07, 'square', 0.12, 90); this.noise(0.04, 0.14, 700); },
  bell(){ this.tone(880, 0.9, 'sine', 0.14); this.tone(1320, 1.2, 'sine', 0.07); this.tone(220, 1.4, 'triangle', 0.05); },
  telegram(){ this.tone(1500, 0.05, 'square', 0.08); setTimeout(()=>this.tone(1100,0.05,'square',0.08),70); setTimeout(()=>this.tone(1700,0.09,'square',0.07),150); },

  glitch(){ this.noise(0.18, 0.14, rnd(300,3000)); this.tone(rnd(60,240), 0.14, 'square', 0.08, rnd(60,900)); },
  thump(soft){ this.tone(soft?52:46, 0.24, 'sine', soft?0.1:0.2, 26); },

  hum(n){ this.tone(200 + n*30, 0.15, 'sine', 0.06); }
};

/* ---------- 5. ОЦЕНЩИК РУК (с учётом анти-законов) ---------- */
function combos(arr, k){
  const out=[], n=arr.length;
  if (n < k) { out.push(arr.slice()); return out; }
  const idx=[], i=0;
  (function rec(start, depth){
    if (depth === k){ out.push(idx.map(j=>arr[j])); return; }
    for (let j=start; j<=n-(k-depth); j++){ idx[depth]=j; rec(j+1, depth+1); }
  })(0,0);
  return out;
}
function rankValue(f, r){ return f.wildDeuce && r === 0 ? 12 : r; }
function isDead(f, r){ return f.oddOnly && (r % 2 === 0); } // чётные номиналы (2,4,6,8,10,Д) становятся мебелью
function evalSet(cards, f){
  const live = cards.filter(c => !isDead(f, c.r));
  const use  = live.length ? live : cards;
  const rv = use.map(c => rankValue(f, c.r));
  const rc = {}; rv.forEach(v => rc[v] = (rc[v]||0) + 1);
  const groups = Object.keys(rc).map(k=>({ r:+k, c:rc[k] })).sort((a,b)=> b.c-a.c || b.r-a.r);
  const sc = {}; use.forEach(c => sc[c.s] = (sc[c.s]||0)+1);
  const suitBest = Object.keys(sc).map(k=>({s:+k,c:sc[k]})).sort((a,b)=>b.c-a.c)[0];
  const flush = use.length >= 4 && suitBest.c === use.length;
  let straight = 0, sf = 0;
  const distinct = [...new Set(rv)].sort((a,b)=>b-a);
  if (distinct.length >= 5){
    for (let i=0; i<=distinct.length-5; i++){
      if (distinct[i]-distinct[i+4] === 4) { straight = distinct[i]; break; }
    }
    if (!straight && distinct[0] === 12 && distinct.slice(-5).join() === '12,3,2,1,0') straight = 3;
    if (straight){
      const need = new Set(); for (let k=0;k<5;k++) need.add(straight-k);
      const bySuit = {};
      use.forEach(c=>{ const v=rankValue(f,c.r); if (need.has(v)) bySuit[c.s]=(bySuit[c.s]||0)+1; });
      for (const s in bySuit) if (bySuit[s] >= 5) sf = straight;
    }
  }
  const p = groups.map(g=>g.c).join('-');
  let cat = 0, hi = groups.length ? groups[0].r : 0;
  if (sf) cat = 8;
  else if (p === '4-1' || p === '5') cat = 7;
  else if (p === '3-2') cat = 6;
  else if (flush) cat = 5;
  else if (straight) cat = 4;
  else if (p === '3-1-1') cat = 3;
  else if (p === '2-2-1' || p === '2-2') cat = 2;
  else if (groups[0].c === 2) cat = 1;
  if (f.pairSupreme && (cat === 1 || cat === 2)) cat = 9;
  if (f.demoteFlush && cat === 5) cat = 0;
  const kick = [];
  const seen = {};
  groups.forEach(g => { for (let i=0;i<g.c;i++){ if (!seen[g.r]) { seen[g.r]=1; } kick.push(g.r); } });
  const suitSum = use.reduce((a,c)=>a + (c.s+1)*1000 + c.r, 0);
  let name = CATN[Math.min(cat, 9)];
  return { cat:cat, kick:kick, suit:suitBest ? suitBest.c : 0, suitSum:suitSum, name:name, cards:use };
}
function cmpArr(a, b){
  const n = Math.max(a.length, b.length);
  for (let i=0;i<n;i++){ const x=a[i]||0, y=b[i]||0; if (x!==y) return x-y; }
  return 0;
}
function compareHands(x, y, f){
  const key = c => f.invert ? [9 - c.cat, c.kick] : [c.cat, c.kick];
  let d = cmpArr(key(x), key(y));
  if (d !== 0) return d;
  if (f.suitFirst){ d = cmpArr([x.suitSum], [y.suitSum]); if (d !== 0) return d; }
  return 0;
}
const _boc = {};
function bestOf(cards, f){
  const key = cards.map(c => c.uid + ':' + c.r + ':' + c.s).join('|') + '#' +
              Object.keys(f).filter(k => f[k]).join(',');
  if (_boc[key]) return _boc[key];
  if (!cards.length) return { cat:-1, kick:[], suit:0, suitSum:0, name:'Пустота', cards:[] };
  let best = null;
  const sets = cards.length > 5 ? combos(cards, 5) : [cards];
  for (const s of sets){
    const e = evalSet(s, f);
    if (!best) best = e;
    else {
      const a = f.invert ? [9-e.cat, e.kick] : [e.cat, e.kick];
      const b = f.invert ? [9-best.cat, best.kick] : [best.cat, best.kick];
      if (cmpArr(a,b) > 0) best = e;
    }
  }
  if (Object.keys(_boc).length > 500) for (const k in _boc) delete _boc[k];
  _boc[key] = best;
  return best;
}

/* ---------- 7. РАСКЛАДКА (используют и логика, и рендер) ---------- */
let L = null;
function layout(){
  const cx = W/2;
  const CW = clamp(W*0.082, 42, 84), CH = CW*1.44;
  const defs = actionButtons();
  const perRow = W < 780 ? 2 : 3;
  const bw = clamp(W*0.20, 104, 196), bh = clamp(H*0.06, 38, 58), bgp = 8;
  const rows = Math.ceil(defs.length/perRow);
  const btnTop = H - (rows*(bh+bgp) + 6) - 10;
  const topBar = 62*U;
  const py = clamp(btnTop - CH*1.30, topBar + 200*U, btnTop - CH*1.02);
  const tableTop = topBar + 6, tableBot = py - 14*U;
  const tableCy = (tableTop + tableBot)/2;
  const th = Math.max(110*U, Math.min((tableBot - tableTop)*0.66, 300*U));
  const tw = Math.min(W*0.9, th*2.85);
  // борд
  const bSpan = Math.min(tw*0.68, CW*5.6);
  const bx = cx - bSpan/2, step = (bSpan - CW)/4;
  const boardY = tableCy - CH*0.60;
  const board = [];
  for (let i=0;i<5;i++) board.push({ x: bx + i*step, y: boardY });
  const pot = { x: cx, y: tableCy + CH*1.12 };
  const dealer = { x: cx, y: Math.max(topBar + 62*U, tableCy - th*0.5 - 66*U) };
  const lx = clamp(cx - tw*0.5 - CW*1.7, Math.max(CW*0.8, 250*U), cx - CW*2.2);
  const rx = clamp(cx + tw*0.5 + CW*0.7, cx + CW*1.2, Math.max(cx + CW*2.2, W - Math.max(CW*2.1, 250*U)));
  const you = [ { x: cx - CW*1.28, y: py }, { x: cx + CW*0.28, y: py } ];
  const left = { x: lx, y: tableCy + CH*0.30 };
  const right = { x: rx, y: tableCy + CH*0.30 };
  const body = [ { x: cx, y: py + CH*1.02 }, { x: lx + CW*0.55, y: tableCy - CH*0.42 }, { x: rx + CW*0.45, y: tableCy - CH*0.42 } ];
  const chip = [ { x: cx + CW*3.7, y: py + CH*0.35 }, { x: lx + CW*0.55, y: tableCy + CH*1.72 }, { x: rx + CW*0.45, y: tableCy + CH*1.72 } ];
  const bub  = [ { x: cx, y: py - 46*U }, { x: lx + CW*0.55, y: tableCy - CH*1.25 }, { x: rx + CW*0.45, y: tableCy - CH*1.25 } ];
  // кнопки
  const btn = [];
  defs.forEach((d, i) => {
    const r = Math.floor(i/perRow), c = i%perRow;
    const rowItems = Math.min(perRow, defs.length - r*perRow);
    const rowW = rowItems*bw + (rowItems-1)*bgp;
    const sx = cx - rowW/2;
    btn.push({ id:d.id, x: sx + c*(bw+bgp), y: btnTop + r*(bh+bgp), w:bw, h:bh,
               label:d.label, sub:d.sub, en:d.en, col:d.col });
  });
  L = { cx, cy: tableCy, CW, CH, tw, th, board, you, left, right, body, chip, bub, btn, bh,
        pot, dealer, py, btnTop, topBar, H0: H*0.2 };
  return L;
}

/* ---------- 8. СООБЩЕНИЯ, ЖУРНАЛ, ТЕЛЕГРАММЫ ---------- */
function logIt(txt, cls){
  G.log.unshift({ t:txt, age:0, cls: cls || '' });
  if (G.log.length > 26) G.log.pop();
}
function say(pi, txt, dur){
  const p = G.players[pi]; if (!p) return;
  p.talk = txt; p.talkT = dur || 2.4;
  G.bub.push({ pi:pi, txt:txt, life:dur || 2.4, t:0, sc:0 });
}
function telegram(title, body, tint){
  G.telQ.push({ title:title, body:body, tint: tint || '#ffdc6a' });
  if (!G.tel) pullTelegram();
}
function pullTelegram(){
  const n = G.telQ.shift();
  if (!n){ G.tel = null; return; }
  G.tel = n; G.tel.t = 0; A.telegram(); G.lawFlash = 1;
}
function burst(x, y, n, col, spd, life){
  for (let i=0;i<n;i++){
    const a = rnd(TAU), v = rnd(0.3, 1) * (spd || 90);
    G.parts.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 30, life:life || rnd(0.5,1.4),
                   t:0, col:col || '#fff', r:rnd(1.5,4.5), rot:rnd(TAU), vr:rnd(-4,4), kind:chance(0.4)?'tooth':'spark' });
  }
}
function shakeIt(n){ G.shake = Math.max(G.shake, n); }
function glitchIt(n){ G.glitch = Math.max(G.glitch, n); A.glitch(); }
function sanity(d, why){
  if (G.f.sanityTax && d < 0) d *= 2;
  G.sanity = clamp(G.sanity + d, 0, 100);
  if (d < 0) { G.eyeQ += -d; if (why) logIt('−' + (-d|0) + ' психеи: ' + why, 'bad'); }
  else if (why) logIt('+' + (d|0) + ' психеи: ' + why, 'good');
  if (G.sanity <= 0) swapReality();
}
function swapReality(){
  const you = G.players[0];
  if (G.board.length >= 2 && you.cards.length){
    const i = ri(0, G.board.length-1);
    let j = ri(0, you.cards.length-1);
    const a = G.board[i], b = you.cards[j];
    G.board[i] = b; you.cards[j] = a;
    b.owner = -2; b.onBoard = true; a.owner = 0; a.onBoard = false;
    a.up = true;
    logIt('ЛИЧНОСТЬ МЕНЯЕТСЯ МЕСТАМИ. БОРД СТАЛ ТОБОЙ.', 'bad');
    telegram('ПРОТОКОЛ «СМЕНА ЛИЧНОСТИ»', 'Ты выдал столу свои карты. Стол выдал тебе свои. Формально ты теперь борд.', '#ff5f87');
    A.scream(); shakeIt(28); glitchIt(1.4); burst(L.cx, L.cy, 60, '#ff5f87', 260);
    G.stats.madness++;
  } else if (you.cards.length){
    // менять не с чем — стол пересобирает тебя изнутри
    you.cards.forEach(c => { c.s = (c.s + ri(1,3)) % 4; c.r = ri(0,12); c.glow = 1.8; c.slide = 0; });
    logIt('МЕНЯТЬСЯ НЕ С ЧЕМ. СТОЛ ПЕРЕСОБРАЛ ТЕБЯ ИЗНУТРИ.', 'bad');
    telegram('ПРОТОКОЛ «СМЕНА ЛИЧНОСТИ»', 'Твои карты остались у тебя. Внутри них стал другим. Ты держишь их, как держат чужое.', '#ff5f87');
    A.scream(); shakeIt(28); glitchIt(1.6); burst(L.cx, L.py, 60, '#ff5f87', 260);
    G.stats.madness++;
  }
  G.sanity = 42;
}

/* ---------- 9. ВЫБОР ЗАКОНОВ ---------- */
function pickLaws(){
  G.laws = [];
  const n = G.hand % 4 === 0 ? 2 : 1;
  const pool = LAWS.slice();
  for (let i=0;i<n;i++){
    const lw = pool.splice(ri(0, pool.length-1), 1)[0];
    G.laws.push(lw);
  }
  G.f = baseFlags();
  G.laws.forEach(lw => { for (const k in lw.f) G.f[k] = lw.f[k]; });
  G.ante = G.f.anteDouble ? 10 : 5;
  G.laws.forEach(lw => telegram('АНТИ-ЗАКОН №' + (lw.id.toUpperCase()), lw.t + ' — ' + lw.s, '#ffdc6a'));
}

/* ---------- 10. ДРЕЙФ РАНГОВ («КОЛБАСНАЯ ТЕОРЕМА») ---------- */
function visibleCards(){
  const out = G.board.filter(c => c.up);
  G.players.forEach(p => { if (p.cards) out.push(...p.cards.filter(c => c.up)); });
  return out;
}
function drift(n, where){
  if (!G.deck) return;
  const src = visibleCards();
  if (!src.length) return;
  const moved = [];
  for (let k=0;k<n;k++){
    const c = pick(src);
    if (c.kissed && chance(0.6)) continue; // поцелованная карта держит свой номинал
    const dir = chance(0.5) ? 1 : -1;
    const nr = clamp(c.r + dir * ri(1, G.f.driftStorm ? 3 : 1), 0, 12);
    if (nr === c.r) continue;
    c.slide = 1; c.slideTo = nr;
    c.glow = 1;
    moved.push(RVAL[c.r] + ' ' + SUITS[c.s].name + ' → ' + RVAL[nr]);
    setTimeoutish(0.25, () => { c.r = nr; A.flip(); });
    if (G.f.driftStorm) glitchIt(0.35);
  }
  if (moved.length && chance(0.8))
    logIt('КОЛБАСНАЯ ТЕОРЕМА: ' + moved.join(', ') + (where ? ' (' + where + ')' : ''), 'drift');
  G.drift = 1;
}
const TIMERZ = [];
function setTimeoutish(d, fn){ TIMERZ.push({ t:G.t + d, fn:fn }); }
function runTimers(){
  for (let i=TIMERZ.length-1;i>=0;i--){
    if (G.t >= TIMERZ[i].t){ const f = TIMERZ[i].fn; TIMERZ.splice(i,1); try{ f(); }catch(e){} }
  }
}
function suitBubble(){
  if (!G.f.suitBubble) return;
  if (!chance(0.18)) return;
  const src = visibleCards(); if (!src.length) return;
  const c = pick(src), old = c.s;
  c.s = (c.s + ri(1,3)) % 4;
  c.glow = 1; glitchIt(0.6); shakeIt(6);
  logIt('Масть ' + SUITS[old].name + ' превратилась в ' + SUITS[c.s].name + '. Никто не удивлён.', 'drift');
  A.bluescreen();
}

/* ---------- 11. РАЗДАЧА ---------- */
function startHand(){
  layout();
  G.scene = 'hand'; G.hand++; G.stats.hands++;
  G.deck = newDeck(); G.board = []; G.muck = []; G.grave = null;
  G.pot = 0; G.street = 0; G.cur = 0; G.minR = G.ante;
  G.bet = [0,0,0]; G.acted = [false,false,false];
  G.folded = [false,false,false]; G.allin = [false,false,false];
  G.sel = -1; G.feedUsed = false; G.kissUsed = false; G.peeked = 0; G.zoyaAce = false;
  G.result = null; G.swap = null; G.showT = 0; G.phase = 'dealing';
  G.players.forEach(p => { p.cards = []; p.talkT = 0; });
  pickLaws();
  // анте
  G.players.forEach((p, i) => {
    const a = Math.min(G.ante, p.chips);
    p.chips -= a; G.pot += a; G.bet[i] = a;
    burst(L.pot.x + rnd(-40,40), L.pot.y, 3, '#f7f3e8', 70, 0.7);
  });
  A.chip();
  logIt('Раздача №' + G.hand + '. Анте ' + G.ante + ' зубов. Свет мигает в такт твоему пульсу.', 'sys');
  // карты
  let d = 0;
  for (let round=0; round<2; round++){
    for (let i=0;i<3;i++){
      const p = G.players[i];
      if (p.chips <= 0 && !p.you) continue;
      const c = G.deck.pop();
      c.owner = i; c.up = p.you; c.x = L.dealer.x; c.y = L.dealer.y;
      c.tx = 0; c.ty = 0; c.trot = rnd(-0.12,0.12); c.sc = 0.25; c.tsc = 1; c.born = G.t + d*0.16;
      p.cards.push(c);
      d++; setTimeoutish(d*0.16, () => A.card());
    }
  }
  G.order = shuffle([0,1,2].filter(i => G.players[i].chips > 0 || i === 0));
  G.ai = 2; // первый ход — твой (мотылёк сдаёт по часовой)
  setTimeoutish(0.9, () => { G.phase = 'pre'; beginStreet(0); });
  sanity(-1, 'сам факт раздачи');
}
function dealBoard(count, cb){
  let d = 0;
  for (let k=0;k<count;k++){
    if (G.f.eatBoard && chance(0.5) && G.deck.length){
      const e = G.deck.pop(); G.muck.push(e); mem(e).eaten++;
      telegram('МОТЫЛЁК ГОЛОДЕН', 'Игорь Николаевич съел карту ' + cname(e) + ' до сдачи. Она была твоей по плану.', '#8dff9e');
      sanity(-6, 'мотылёк съел твою карту');
    }
    const c = G.deck.pop();
    if (!c) break;
    c.onBoard = true; c.owner = -2; c.up = false;
    c.x = L.dealer.x; c.y = L.dealer.y; c.sc = 0.25;
    c.born = G.t + d*0.2;
    G.board.push(c);
    d++;
    setTimeoutish(d*0.2, () => { A.card(); });
    setTimeoutish(d*0.2 + 0.32, () => { c.up = true; c.glow = 1; A.flip();
      if (mem(c).eaten > 0 || mem(c).grudge >= 3){ c.bite = 1; sanity(-9, 'эта карта помнит, как ты её сдал');
        logIt('Карта ' + cname(c) + ' вернулась с обидой. Она кусается.', 'bad');
        G.stats.bites++; glitchIt(0.9); shakeIt(14); A.scream(); }
    });
  }
  setTimeoutish(d*0.2 + 0.5, () => { drift(G.f.driftStorm ? 3 : 1, 'борд остывает'); suitBubble(); if (cb) cb(); });
}

/* ---------- 12. ТОРГИ ---------- */
function beginStreet(st){
  G.street = st; G.cur = 0;
  G.bet = [0,0,0]; G.acted = [false,false,false];
  if (G.f.graveVote && G.muck.length){
    G.grave = pick(G.muck);
    logIt('МЁРТВЫЕ ГОЛОСУЮТ: карта ' + cname(G.grave) + ' участвует в раздаче из сброса.', 'drift');
    glitchIt(0.4);
  } else G.grave = null;
  const live = G.order.filter(i => !G.folded[i] && G.players[i].cards.length);
  if (live.length < 2){ return showdown(); }
  if (st === 1) dealBoard(3, () => { G.phase='flop'; nextTurn(true); });
  else if (st === 2) dealBoard(1, () => { G.phase='turn'; nextTurn(true); });
  else if (st === 3) dealBoard(1, () => { G.phase='river'; nextTurn(true); });
  else { G.phase='pre'; nextTurn(true); }
  madness(st);
}
function nextTurn(fromStreet){
  const live = G.order.filter(i => !G.folded[i] && G.players[i].cards.length);
  if (live.length <= 1){ showdown(); return; }
  let guard = 0;
  while (guard++ < 12){
    G.ai = (G.ai + 1) % 3;
    const i = G.ai;
    if (G.folded[i] || !G.players[i].cards.length) continue;
    if (G.players[i].chips <= 0 || G.allin[i]){ G.acted[i] = true; continue; } // ему уже нечем играть
    if (!G.acted[i] || G.bet[i] < G.cur){ return setTurn(i); }
  }
  streetDone();}
function setTurn(i){
  G.ai = i;
  const p = G.players[i];
  if (p.chips <= 0 && G.bet[i] >= G.cur){ G.acted[i] = true; return nextTurn(); }
  if (!p.you){
    const kind = p.kind;
    if (kind === 'andry' && p.freeze > 0){
      p.freeze--; logIt('АНДРЮША завис: «СДАЧА… СДАЧА… СДАЧА» — слово вызвало синий экран.', 'bad');
      A.bluescreen(); glitchIt(1.1); shakeIt(10);
      const r = ri(0,2); G.bub.push({ pi:i, txt:['ОШИБКА 0xПОКЕР','ВОЗВРАТ ТОВАРА НЕВОЗМОЖЕН','СДАЧА НЕ ПРЕДУСМОТРЕНА'][r], life:2.2, t:0, sc:0 });
      setTimeoutish(1.2, () => { G.acted[i] = true; nextTurn(); });
      return;
    }
    setTimeoutish(rnd(0.75, 1.7), () => botAct(i));
  }
}
function streetDone(){
  if (G.street === 3){ G.phase = 'show'; showdown(); }
  else beginStreet(G.street + 1);
}
function payChips(i, amt){
  const p = G.players[i];
  const real = Math.min(amt, p.chips);
  p.chips -= real; G.bet[i] += real; G.pot += real;
  if (p.chips === 0) G.allin[i] = true;
  for (let k=0;k<Math.min(6, Math.ceil(real/3));k++)
    burst(L.pot.x + rnd(-50,50), L.pot.y + rnd(-10,10), 1, '#f7f3e8', 60, 0.8);
  A.tooth();
  return real;
}
function doAction(i, act, to){
  const p = G.players[i];
  if (G.folded[i] || G.phase === 'show' || G.phase === 'end' || G.phase === 'dealing') return;
  if (act === 'check' && G.cur > G.bet[i]) return;
  if (act === 'call' && G.cur <= G.bet[i]) return doAction(i, 'check');
  G.acted[i] = true;
  if (act === 'fold'){
    G.folded[i] = true;
    p.cards.forEach(c => { const m = mem(c); m.folds++; m.grudge += 1.5; m.last = i; G.muck.push(c); c.up = false; c.owner = -3; });
    p.cards = [];
    logIt(p.name + (p.you ? ' выходишь' : ' выходит') + ' из комнаты. Карты помнят это.', 'muck');
    if (p.you){ A.scream(); shakeIt(12); glitchIt(0.5); say(0, 'Я просто выйду подышать', 2); sanity(-4, 'трусость'); }
    else { say(i, pick(['Я тут вяжу.','Ухожу в стенной шкаф.','Мои карты дышали без меня.']), 2.2); A.clack(); }
    if (G.f.graveVote && G.muck.length){ /* мёртвые проголосуют на шоудауне */ }
    nextTurn(); return;
  }
  if (act === 'check'){
    if (G.cur > G.bet[i]) return;
    logIt(p.name + (p.you ? ' молчишь' : ' молчит') + (chance(0.3) ? (p.you ? ' и моргаешь' : ' и моргает') + ' ровно один раз' : ''), 'act');
    say(i, p.you ? '…' : pick(['Молчание — тоже ход.','Не скажу.','Пусть стол решает.','Я просто дышу.']), 1.6);
    A.clack(); sanity(-0.5*(G.f.sanityTax?2:1)); suitBubble(); nextTurn(); return;
  }
  if (act === 'call'){
    const need = G.cur - G.bet[i];
    const real = payChips(i, need);
    if (real <= 0){
      logIt(p.name + (p.you ? ' отдаёшь' : ' отдаёт') + ' столу воздух — играть нечем', 'muck');
      A.clack(); nextTurn(); return;
    }
    logIt(p.name + (p.you ? ' кладёшь ' : ' кладёт ') + real + ' зубов' + (chance(0.35) ? ' (сдача не выдаётся)' : ''), 'act');
    if (!p.you && chance(0.4)) say(i, pick(['Возьми. Сдачи не будет.','Зуб за зуб.','Жуёшь?']), 1.8);
    if (p.kind === 'andry' && /сдача/.test(G.log[0].t)){ p.freeze = 1; logIt('Андрюша услышал слово «сдача» и завис.', 'bad'); }
    A.chip(); sanity(-1*(G.f.sanityTax?2:1)); suitBubble(); nextTurn(); return;
  }
  if (act === 'raise'){
    const prev = G.cur;
    const target = clamp(Math.round(to), G.cur + Math.max(1, G.minR), G.bet[i] + p.chips);
    const real = payChips(i, target - G.bet[i]);
    G.minR = Math.max(G.ante, target - prev);
    G.cur = target; G.lastAggressor = i;
    for (let j=0;j<3;j++) if (j !== i && !G.folded[j]) G.acted[j] = false;
    G.acted[i] = true;
    logIt(p.name + (p.you ? ' поднимаешь' : ' поднимает') + ' реальность до ' + target + ' зубов', 'act');
    if (!p.you){ say(i, pick(['Я добавляю, значит живой.','Повышаю. Болит.','Ставки растут как зубы в горле.']), 1.9); }
    else { shakeIt(9); A.bell(); }
    glitchIt(0.25); sanity(-(p.you?2:1)*(G.f.sanityTax?2:1)); suitBubble();
    if (G.f.driftStorm && chance(0.5)) drift(2, 'повышение тряхнуло ранги');
    nextTurn(); return;
  }
}

/* ---------- 13. ОЦЕНКА СИЛЫ (для ботов и подсказок) ---------- */
function holeFor(i){
  const p = G.players[i];
  let cards = p.cards.slice();
  if (!G.f.ignoreBoard) cards = cards.concat(G.board.filter(c => c.up));
  if (G.f.boardTail && p.you){
    const tail = G.board.filter(c => c.up).slice(-3);
    cards = cards.concat(tail); // последние три карты борда считаются твоими зубами дважды
  }
  if (G.f.graveVote && G.grave) cards.push(G.grave);
  return cards;
}
function strength(i){
  const p = G.players[i];
  if (!p.cards.length) return 0;
  const mine = holeFor(i);
  const e = bestOf(mine, G.f);
  let v = clamp((e.cat + 1) / 9, 0, 1);
  const hi = Math.max.apply(null, mine.map(c => c.r));
  v = v * 0.72 + (hi / 12) * 0.28;
  if (G.f.invert) v = 1 - v;
  return v;
}
function handName(i){
  const e = bestOf(holeFor(i), G.f);
  return e.name;
}

/* ---------- 14. БОТЫ ---------- */
const ZOYA_LINES = ['Вяжи, вяжи, вяжи…','У меня тут туз в напёрстке.','Ты не семёрка? Слава стенам.',
  'Игорь Николаевич, не смотри на меня так.','Раньше за этим столом сидел мой муж. Он стал линолеумом.',
  'Дай зуб, родной. Мне только на накладку.'];
const ANDRY_LINES = ['Вставьте монету или сознание.','Товар не возвращается.','Проходите, следующий.',
  'Я вижу борд. Я вижу всё. Я вижу вас.','Чек… шек… сек… ссек…','Скидка на вечность: 0%.'];
function botAct(i){
  const p = G.players[i];
  if (G.folded[i] || G.phase === 'show' || G.phase === 'end' || G.scene !== 'hand') return;
  // чит Зои: туз из рукава (один раз на раздачу)
  if (p.kind === 'zoya' && !G.zoyaAce && chance(0.4) && p.cards.length){
    G.zoyaAce = true;
    const victim = p.cards[ri(0, p.cards.length-1)];
    const ace = G.deck.length ? G.deck[G.deck.length-1] : null;
    const newCard = mkCard(ri(0,3), 12);
    newCard.s = victim.s;
    logIt('Зоя Павловна вытащила из напёрстка карту ' + cname(newCard) + '. Это не её карта.', 'cheat');
    say(i, 'Это не подглядывание, это рукоделие.', 2.4);
    p.cards[p.cards.indexOf(victim)] = newCard;
    newCard.owner = i; newCard.x = victim.x; newCard.y = victim.y - 30; newCard.sc = 0.4;
    newCard.up = false; newCard.glow = 1.6;
    G.deck.push(victim); shuffle(G.deck);
    sanity(-5, 'ты это видел, но доказательства уходят в линолеум');
    glitchIt(0.7); A.telegram();
  }
  // фобия Зои: семёрки
  if (p.kind === 'zoya'){
    const seven = p.cards.find(c => c.b === 5);
    if (seven && !G.f.wildDeuce){
      p.phobia7++;
      logIt('Зоя Павловна увидела на руке карту ' + cname(seven) + '. Мигрень. Она сбрасывает.', 'bad');
      say(i, 'СЕМЁРКИ. УБЕРИТЕ СЕМЁРКИ. Я ИХ СЛЫШУ.', 2.6);
      A.scream(); shakeIt(20); glitchIt(1.2); burst(seven.x + L.CW/2, seven.y + L.CH/2, 26, '#ff5f87', 200);
      doAction(i, 'fold'); return;
    }
  }
  // чит Андрюши: взгляд в борд
  if (p.kind === 'andry' && chance(0.35)){
    G.peeked++;
    if (G.peeked >= 3){
      logIt('АНДРЮША-117 подглядел дважды. Третий раз — перегрузка. Он выключается.', 'bad');
      say(i, 'СИСТЕМНАЯ ОШИБКА: СЛИШКОМ МНОГО БУДУЩЕГО', 3);
      A.bluescreen(); glitchIt(1.6); shakeIt(24);
      doAction(i, 'fold'); return;
    }
    const nxt = G.deck[G.deck.length-1];
    if (nxt) say(i, 'Скоро ляжет карта ' + cname(nxt) + '. Я уже вижу.', 2.2);
    logIt('Андрюша объявил следующую карту борда заранее.', 'cheat');
    sanity(-3, 'будущее сказали тебе в лицо');
  }
  const s = strength(i);
  const need = G.cur - G.bet[i];
  const pot = G.pot + need;
  const odds = need > 0 ? need / pot : 0;
  let aggr = p.aggr * (G.f.botsPassive ? 0.15 : 1);
  let bluf = p.bluff;
  if (p.kind === 'zoya' && G.street > 1) bluf *= 1.5;
  if (p.kind === 'andry') bluf *= (G.hand % 2 ? 1.3 : 0.7);
  // raise
  if (need === 0){
    if (s > 0.62 && chance(aggr)){
      const to = clamp(Math.round(G.cur + Math.max(G.ante, G.pot * (0.5 + s))), G.minR, p.chips);
      doAction(i, 'raise', Math.max(G.cur + G.minR, to)); return;
    }
    if (chance(bluf) && p.chips > G.ante * 2){
      doAction(i, 'raise', G.cur + Math.max(G.minR, Math.round(G.pot * 0.4))); return;
    }
    doAction(i, 'check'); return;
  }
  if (s > 0.55 || (s > odds * 0.9 && chance(0.8))){
    if (s > 0.78 && chance(aggr * 0.8) && p.chips > need + G.minR){
      doAction(i, 'raise', G.cur + Math.max(G.minR, Math.round(G.pot * (0.6 + s * 0.5)))); return;
    }
    doAction(i, 'call'); return;
  }
  if (chance(bluf * 0.5) && p.chips > need + G.minR && G.street < 3){
    doAction(i, 'raise', G.cur + Math.max(G.minR, Math.round(need * 1.6))); return;
  }
  if (need <= p.chips * 0.06 && chance(0.5)){ doAction(i, 'call'); return; }
  doAction(i, 'fold');
}

const WHISPERS = ['под линолеумом кто-то считает твои зубы','Игорь Николаевич моргает дважды там, где глаз нет',
  'раковина требует открыть воду. вода требует открыть тебя','лампа шепчет твоё детское имя задом наперёд',

function madness(st){
  const roll = Math.random();

  }
  else if (roll < 0.38 && st > 0 && G.deck.length){
    const c = G.deck.pop(); c.onBoard = true; c.owner = -2; c.up = false;
    c.x = L.dealer.x; c.y = L.dealer.y; c.sc = 0.25; c.born = G.t;

    setTimeoutish(0.4, () => { c.up = true; A.flip(); });
    G.stats.madness++;
  }
  else if (roll < 0.5){
    const c = G.board.find(x => x.up);
    if (c){ c.slide = 1; setTimeoutish(0.2, () => { c.r = ri(0,12); c.glow = 1.4; A.scream(); });
      logIt('Карта ' + RVAL[c.r] + ' на борду отказалась от своего номинала.', 'drift');
      glitchIt(0.9); shakeIt(12); sanity(-4, 'ты слышал, как карта меняет имя'); }
  }
  else if (roll < 0.6){
    G.eyeQ += 8; logIt('Стены запомнили эту раздачу.', 'whisper');
  }
  else if (roll < 0.72 && !G.f.botsPassive && G.street > 0){
    const b = G.players[1 + ri(0,1)];
    say(1 + (b.kind==='zoya'?0:1), pick(b.kind==='zoya' ? ZOYA_LINES : ANDRY_LINES), 2.4);
  }

  else {

  }
  G.breath = 1;
}

/* ---------- 16. ШОУДАУН И РАСПРЕДЕЛЕНИЕ ЗУБОВ ---------- */
function showdown(){
  layout();
  G.phase = 'show'; G.showT = 0;
  G.players.forEach(p => p.cards.forEach(c => { c.up = true; c.glow = 1.2; }));
  A.bell(); shakeIt(6);
  const live = G.order.filter(i => !G.folded[i] && G.players[i].cards.length);
  if (live.length === 0) return endHand([], 'Никто не остался. Зубы ушли в линолеум.');
  if (live.length === 1){
    const w = G.players[live[0]];
    w.cards.forEach(c => { c.up = true; });
    return endHand([live[0]], 'Все вышли из комнаты. В комнате остался ' + w.name + '.');
  }
  const scored = live.map(i => ({ i:i, e:bestOf(holeFor(i), G.f) }));
  scored.sort((x, y) => -compareHands(x.e, y.e, G.f));
  G.result = scored;
  const top = scored[0].e;
  let winners = scored.filter(s => compareHands(s.e, top, G.f) === 0).map(s => s.i);
  // месть карт
  let revenger = null;
  scored.forEach(s => s.e.cards.forEach(c => { const m = mem(c); if (m.grudge >= 4 && !revenger) revenger = c; }));
  if (revenger && chance(0.45)){
    logIt('ОБИЖЕННАЯ КАРТА: ' + RVAL[revenger.b] + ' ' + SUITS[revenger.s].name +
          ' отказалась приносить победу. Банк забирает СТОЛ.', 'bad');
    telegram('БАНК ЗАБРАЛ СТОЛ', 'Карта помнит, как её бросали. Она договорилась с линолеумом. Ты слышишь, как зубы уходят под пол.', '#b07bff');
    winners = [];
    sanity(-12, 'карта мстит'); glitchIt(1.4); shakeIt(22); A.scream();
    G.stats.madness++;
  }
  G.players.forEach((p, i) => {
    if (!p.cards.length) return;
    const sc = scored.find(s => s.i === i);
    if (!sc) return;
    say(i, (p.you ? 'У меня: ' : p.name.split(' ')[0] + ': ') + sc.e.name, 3.2);
  });
  endHand(winners, null);
}
function endHand(winners, forcedMsg){
  const pot = G.pot; G.pot = 0;
  const msg = [];
  if (forcedMsg){ msg.push(forcedMsg); }
  if (winners.length === 0){
    msg.push('СТОЛ съел ' + pot + ' зубов. Он долго жевал.');
    A.bluescreen(); shakeIt(18);
  } else {
    const share = Math.floor(pot / winners.length);
    const rest = pot - share * winners.length;
    winners.forEach((wi, k) => {
      const p = G.players[wi];
      const gain = share + (k === 0 ? rest : 0);
      p.chips += gain;
      p.cards.forEach(c => { mem(c).wins++; mem(c).grudge = Math.max(0, mem(c).grudge - 0.5); mem(c).love += 0.4; });
      msg.push(p.name + (p.you ? ' забираешь ' : ' забирает ') + gain + ' зубов (' + (G.result ? bestOf(holeFor(wi), G.f).name : 'чужой сброс') + ')');
      if (wi === 0){ A.win(); sanity(14, 'ты снова дышишь победой'); burst(L.cx, L.cy, 40, '#ffdc6a', 220); }
      else { A.bust(); sanity(-6, 'чужие зубы звенят ближе'); }
    });
    G.stats.wins += winners.includes(0) ? 1 : 0;
    burst(L.pot.x, L.pot.y, 26, '#f7f3e8', 180, 1.2);
  }
  // проигравшие карты обижаются
  G.players.forEach(p => p.cards.forEach(c => {
    const m = mem(c);
    if (!winners.some(wi => G.players[wi].cards.includes(c))) { m.lost++; m.grudge += 1; }
  }));
  G.phase = 'end'; G.showT = 0;
  msg.forEach(t => logIt(t, 'money'));
  layout();
  setTimeoutish(3.6, nextHand);
  checkBust();
}
function checkBust(){
  G.players.forEach((p, i) => {
    if (!p.you && p.chips <= 0 && !p.busted){
      p.busted = true;
      logIt(p.name + ' выписан(а). ' + (p.kind === 'zoya' ? 'Стул остался вязать без неё.' : 'Касса продолжает печатать чеки в пустоту.'), 'sys');
      telegram('ВЫПИСКА', p.name + ' забирает свои зубы и уходит в стену. '+ pick(['Дверь хлопает трижды.','Дверь осталась в ней.','Стул помахал след.']), '#79d6ff');
      A.scream(); glitchIt(1);
    }
  });
  const alive = G.players.filter(p => !p.you && !p.busted && p.chips > 0).length;
  if (G.players[0].chips <= 0){
    setTimeoutish(0.4, () => { G.scene = 'over'; A.bust(); glitchIt(2); shakeIt(30); });
  } else if (alive === 0){
    setTimeoutish(0.4, () => { G.scene = 'win'; A.win(); G.flash = 1; });
  }
}
function nextHand(){
  if (G.scene !== 'hand') return;
  if (G.players[0].chips <= 0){ G.scene = 'over'; return; }
  if (G.players.filter(p => !p.you && p.chips > 0).length === 0){ G.scene = 'win'; return; }
  // подкидываем разорившимся ботам по 20 «займовых» зубов — стол не закрывается
  G.players.forEach(p => { if (!p.you && p.chips <= 0){ p.chips = 20; p.busted = false;
    logIt(p.name + ' заняла зубов у стенного шкафа. Игра продолжается.', 'sys'); } });
  startHand();
}

/* ---------- 17. СПЕЦИФИЧЕСКИЕ ДЕЙСТВИЯ ИГРОКА ---------- */
function needCall(){ return Math.max(0, G.cur - G.bet[0]); }
function raiseTarget(){ return clamp(G.cur + Math.max(G.minR, Math.round(G.pot * 0.55)), G.cur + G.minR, G.players[0].chips + G.bet[0]); }
function allInTarget(){ return G.bet[0] + G.players[0].chips; }
function playerAct(id){
  if (G.scene !== 'hand') return;
  if (G.ai !== 0 || G.folded[0] || G.phase === 'show' || G.phase === 'end' || G.phase === 'dealing') return;
  const you = G.players[0];
  if (id === 'fold') return doAction(0, 'fold');
  if (id === 'call') return needCall() > 0 ? doAction(0, 'call') : doAction(0, 'check');
  if (id === 'raise') return doAction(0, 'raise', raiseTarget());
  if (id === 'allin'){ say(0, 'Я закладываю почку. Она тут лишняя.', 2.4); return doAction(0, 'raise', allInTarget()); }
  if (id === 'kiss'){
    if (G.sel < 0 || !you.cards[G.sel]){ say(0, 'Сначала выбери карту.', 1.8); return; }
    const c = you.cards[G.sel];
    if (c.kissed){ say(0, 'Уже. Мы оба это помним.', 1.8); return; }
    c.kissed = true; c.glow = 1.6; mem(c).love += 2; mem(c).grudge = Math.max(0, mem(c).grudge - 2);
    const q = L ? { x:c.x + L.CW/2, y:c.y + L.CH/2 } : { x:W/2, y:H/2 };
    burst(q.x, q.y, 20, '#ff5f87', 90, 1.1);
    A.tone(660, 0.35, 'sine', 0.1, 990);
    sanity(6, 'ты поцеловал карту. Она теперь на твоей стороне');
    logIt('Ты поцеловал карту ' + cname(c) + '. Она запомнила вкус.', 'good');
    say(0, pick(['Спасибо, что не сдал.','Я теперь с тобой до конца.','Можно я полежу вверх лицом?']), 2.2);
    return;
  }
  if (id === 'feed'){
    if (G.feedUsed){ say(0, 'Стол наелся. На эту раздачу.', 1.8); return; }
    if (G.sel < 0 || !you.cards[G.sel]){ say(0, 'Выбери карту, которую готов съесть.', 1.8); return; }
    const c = you.cards[G.sel];
    const m = mem(c);
    you.cards.splice(G.sel, 1); G.sel = -1;
    m.eaten++; m.grudge += 2.5; m.last = 0;
    c.owner = -3; c.up = false; G.muck.push(c);
    const pay = Math.min(G.ante * 2, you.chips);
    you.chips -= pay; G.pot += pay;
    c.x = L.cx; c.y = L.cy; c.tx = L.pot.x; c.ty = L.pot.y + 20; c.trot = rnd(-1,1);
    G.feedUsed = true;
    A.noise(0.5, 0.25, 420, 'lowpass'); A.clack(); shakeIt(16); glitchIt(1);
    sanity(9, 'ты накормил стол. стало спокойнее');
    logIt('Тот, кто сбрасывает свою карту и кормит стол, платит ' + pay + ' зубов. Карта будет помнить.', 'muck');
    telegram('КАРТА СЪЕДЕНА', 'Карта ' + cname(c) + ' ушла под скатерть. Если она вернётся на борд — она укусит.', '#b07bff');
    burst(L.pot.x, L.pot.y, 30, '#b07bff', 160);
  }
}

    { id:'raise', label:'ПОДНЯТЬ РЕАЛЬНОСТЬ', sub:'+' + Math.max(0, raiseTarget() - G.bet[0]) + ' зубов', en:can && you.chips > Math.max(1, G.minR), col:'#ffdc6a' },
    { id:'allin', label:'ЗАЛОЖИТЬ ПОЧКУ', sub:'ва-банк: ' + you.chips, en:can && you.chips > 0, col:'#ff8a3d' },
    { id:'kiss',  label:'ПОЦЕЛОВАТЬ КАРТУ', sub:'+6 психеи, верность', en:can && you.cards.some(c => !c.kissed), col:'#8dff9e' },
    { id:'feed',  label:'ПОКОРМИТЬ СТОЛ', sub:'съешь свою карту', en:can && !G.feedUsed && you.cards.length > 1, col:'#b07bff' }
  ];
  if (G.f.mirror) out.reverse();
  return out;
}

/* ---------- 18. МАЛЕНЬКИЕ ХУДОЖНИКИ ---------- */
const F_SERIF = '"Iowan Old Style","Palatino Linotype",Georgia,serif';
const F_MONO  = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';
function rrect(x, y, w, h, r){
  ctx.beginPath();
  r = Math.min(r, w/2, h/2);
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
}
function txt(s, x, y, size, col, align, font, alpha, rot, sh){
  ctx.save();
  ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.font = size + 'px ' + (font || F_SERIF);
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  if (sh){ ctx.fillStyle = sh; ctx.fillText(s, 1.5, 1.5); }
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function wrap(s, max){
  const words = String(s).split(' '), out = []; let line = '';
  ctx.font = max.f || F_SERIF;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > max.w && line){ out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
/* процедурные масти */
function glyphNail(x, y, s, col){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = s*0.13;
  ctx.beginPath(); ctx.moveTo(-s*0.16, -s*0.5); ctx.lineTo(s*0.16, -s*0.5);
  ctx.lineTo(s*0.09, s*0.34); ctx.lineTo(0, s*0.55); ctx.lineTo(-s*0.09, s*0.34); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -s*0.5, s*0.3, s*0.13, 0, 0, TAU); ctx.fill();
  ctx.restore();
}
function glyphTooth(x, y, s, col){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-s*0.42, -s*0.42); ctx.quadraticCurveTo(0, -s*0.72, s*0.42, -s*0.42);
  ctx.quadraticCurveTo(s*0.52, s*0.05, s*0.3, s*0.5); ctx.quadraticCurveTo(s*0.12, s*0.2, 0, s*0.5);
  ctx.quadraticCurveTo(-s*0.12, s*0.2, -s*0.3, s*0.5); ctx.quadraticCurveTo(-s*0.52, s*0.05, -s*0.42, -s*0.42);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function glyphGlass(x, y, s, col){
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(0, -s*0.55); ctx.lineTo(s*0.4, -s*0.05); ctx.lineTo(s*0.18, s*0.5); ctx.lineTo(-s*0.28, s*0.42); ctx.lineTo(-s*0.42, -s*0.12);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s*0.05;
  ctx.beginPath(); ctx.moveTo(-s*0.2, -s*0.28); ctx.lineTo(s*0.16, s*0.1); ctx.stroke(); ctx.restore();
}
function glyphMoth(x, y, s, col){
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col;
  for (const k of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(0, -s*0.1);
    ctx.quadraticCurveTo(k*s*0.72, -s*0.6, k*s*0.5, s*0.05);
    ctx.quadraticCurveTo(k*s*0.42, s*0.5, 0, s*0.2);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = col; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.09, s*0.34, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = s*0.05;
  ctx.beginPath(); ctx.moveTo(0, -s*0.3); ctx.lineTo(-s*0.16, -s*0.56); ctx.moveTo(0, -s*0.3); ctx.lineTo(s*0.16, -s*0.56); ctx.stroke();
  ctx.restore();
}
const GLYPH = [glyphNail, glyphTooth, glyphGlass, glyphMoth];

/* ---------- 19. КОМНАТА (фон) ---------- */
function drawRoom(dt){
  const dist = 1 - G.sanity/100;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1116'); g.addColorStop(0.42, '#0d1a1c'); g.addColorStop(1, '#05070a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // кафель на стене
  const ts = clamp(W/16, 34, 90);
  ctx.strokeStyle = rgba(120, 190, 180, 0.07); ctx.lineWidth = 1;
  for (let x = -((G.t*4)%ts); x < W + ts; x += ts){
    ctx.beginPath(); ctx.moveTo(x + wob(x, G.t*0.2, dist*6), 0); ctx.lineTo(x, H*0.62); ctx.stroke();
  }
  for (let y = 0; y < H*0.62; y += ts){
    ctx.beginPath(); ctx.moveTo(0, y + wob(y, G.t*0.25, dist*5)); ctx.lineTo(W, y); ctx.stroke();
  }
  // люминесцентная лампа
  const lampY = H*0.055, lampW = W*0.42;
  const flick = nz('lamp', Math.floor(G.t*14)) > 0.12 ? 1 : 0.25;
  const lg = ctx.createRadialGradient(W/2, lampY, 8, W/2, lampY, lampW*0.9);
  lg.addColorStop(0, rgba(210, 255, 240, 0.5*flick)); lg.addColorStop(0.4, rgba(120, 210, 190, 0.1*flick));
  lg.addColorStop(1, rgba(0,0,0,0));
  ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H*0.6);
  ctx.fillStyle = rgba(225, 255, 245, 0.75*flick);
  rrect(W/2 - lampW/2, lampY - 5*U, lampW, 10*U, 5); ctx.fill();
  ctx.strokeStyle = rgba(90, 130, 120, 0.5); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2 - lampW/2, lampY); ctx.lineTo(W/2 - lampW/2 - 24, lampY - 30);
  ctx.moveTo(W/2 + lampW/2, lampY); ctx.lineTo(W/2 + lampW/2 + 24, lampY - 30); ctx.stroke();
  if (flick < 0.5 && chance(0.3)) A.hum(3);
  // окно в никуда
  const wx = W*0.885, wy = H*0.045, ww = Math.min(W*0.095, 150*U), wh = ww*1.25;
  ctx.save(); ctx.beginPath(); rrect(wx, wy, ww, wh, 6); ctx.clip();
  const ng = ctx.createLinearGradient(wx, wy, wx + ww, wy + wh);
  ng.addColorStop(0, '#1b0526'); ng.addColorStop(1, '#04121a');
  ctx.fillStyle = ng; ctx.fillRect(wx, wy, ww, wh);
  for (let i=0;i<26;i++){
    const sx = wx + nz('star', i)*ww, sy = wy + nz('star2', i)*wh;
    const tw = 0.4 + 0.6*Math.abs(Math.sin(G.t*(1+i%4) + i));
    ctx.fillStyle = rgba(200, 240, 255, 0.5*tw);
    ctx.beginPath(); ctx.arc(sx, sy, (i%3)*0.7 + 0.6, 0, TAU); ctx.fill();
  }
  // большое зрачок-луна
  const px = wx + ww*0.62, py = wy + wh*0.44, pr = Math.min(ww, wh)*0.3;
  ctx.fillStyle = rgba(255, 240, 200, 0.85); ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(10, 5, 15, 0.9); ctx.beginPath(); ctx.ellipse(px + wob(2, G.t*0.4, pr*0.15), py, pr*0.42, pr*0.6, 0, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = rgba(150, 200, 190, 0.25); ctx.lineWidth = 3; rrect(wx, wy, ww, wh, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wx + ww/2, wy); ctx.lineTo(wx + ww/2, wy + wh); ctx.stroke();
  // линолеум: перспектива + разводы-воспоминания
  const floorY = H*0.6;
  ctx.save(); ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.clip();
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0, '#122023'); fg.addColorStop(1, '#070d10');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.strokeStyle = rgba(130, 170, 160, 0.09);
  for (let i=-10;i<=10;i++){
    ctx.beginPath(); ctx.moveTo(W/2 + i*W*0.07, floorY); ctx.lineTo(W/2 + i*W*0.5, H); ctx.stroke();
  }
  for (let i=1;i<8;i++){
    const y = floorY + (H-floorY)*Math.pow(i/8, 2.2);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // отпечатки пальцев пола (он всё помнит)
  for (let i=0;i<12;i++){
    const fx = (nz('fp', i)*1.3 - 0.15)*W, fy = floorY + nz('fp2', i)*(H-floorY);
    const a = 0.03 + 0.05*Math.abs(Math.sin(G.t*0.3 + i)) + dist*0.06;
    ctx.save(); ctx.translate(fx, fy); ctx.rotate(nz('fp3', i)*TAU);
    ctx.strokeStyle = rgba(190, 255, 235, a); ctx.lineWidth = 1.4;
    for (let r = 3; r < 18; r += 3.4){ ctx.beginPath(); ctx.ellipse(0, 0, r, r*1.35, 0, 0.4, TAU - 0.6); ctx.stroke(); }
    ctx.restore();
  }
  ctx.restore();
  // глаза в стенах (появляются, когда психея течёт)
  const eyes = Math.min(9, Math.floor((G.eyeQ + dist*22)/9));
  for (let i=0;i<eyes;i++){
    const ex = W*(0.06 + nz('eye', i)*0.88), ey = H*(0.06 + nz('eye2', i)*0.42);
    const s = (9 + nz('eye3', i)*15)*U;
    const blink = Math.max(0.05, Math.abs(Math.sin(G.t*(0.6 + nz('eye4', i)) + i)));
    ctx.save(); ctx.translate(ex, ey);
    ctx.fillStyle = rgba(238, 250, 246, 0.55);
    ctx.beginPath(); ctx.ellipse(0, 0, s, s*blink, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(20, 30, 26, 0.85);
    ctx.beginPath(); ctx.arc(wob(i, G.t*0.8, s*0.2), 0, s*0.34*Math.max(0.2, blink), 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(255, 110, 130, 0.25); ctx.lineWidth = 1;
    for (let k=0;k<5;k++){ const a = k/5*TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.9, Math.sin(a)*s*blink*0.9);
      ctx.lineTo(Math.cos(a)*s*1.3, Math.sin(a)*s*blink*1.3); ctx.stroke(); }
    ctx.restore();
  }
  // потёки
  for (let i=0;i<7;i++){
    const x = nz('drip', i)*W, len = (30 + nz('drip2', i)*120)*U;
    const y = (G.t*(20 + nz('drip3', i)*40) + nz('drip4', i)*300) % (H + 200) - 100;
    ctx.strokeStyle = rgba(180, 255, 220, 0.08); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(i)*2, y + len); ctx.stroke();
  }
}

/* ---------- 20. СТОЛ (живой) ---------- */
function drawTable(){
  const dist = 1 - G.sanity/100;
  const cx = L.cx, cy = L.cy, tw = L.tw, th = L.th;
  G.breath = Math.max(0, G.breath - 0.02);
  const br = 1 + Math.sin(G.t*0.9)*0.012 + G.breath*0.05 + dist*0.02*Math.sin(G.t*3.3);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(br, br);
  // тень
  ctx.fillStyle = rgba(0, 0, 0, 0.55);
  ctx.beginPath(); ctx.ellipse(0, th*0.28, tw*0.56, th*0.5, 0, 0, TAU); ctx.fill();
  // тело стола: дышащая плёнка
  const tg = ctx.createRadialGradient(0, -th*0.2, tw*0.05, 0, 0, tw*0.55);
  tg.addColorStop(0, '#2b6a5e'); tg.addColorStop(0.55, '#12463f'); tg.addColorStop(1, '#06201f');
  ctx.fillStyle = tg;
  ctx.beginPath();
  const N = 64;
  for (let i=0;i<=N;i++){
    const a = i/N*TAU;
    const rr = 1 + Math.sin(a*3 + G.t*1.1)*0.022 + Math.sin(a*7 - G.t*0.7)*0.014*(1+dist*3) + Math.sin(a*13 + G.t*2.2)*0.006*(1+dist*5);
    const x = Math.cos(a)*tw*0.5*rr, y = Math.sin(a)*th*0.5*rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  // кайма-бахрома из нервов
  ctx.strokeStyle = rgba(255, 120, 150, 0.22 + dist*0.25); ctx.lineWidth = 2.2;
  ctx.stroke();
  ctx.strokeStyle = rgba(190, 255, 230, 0.1); ctx.lineWidth = 1;
  for (let i=0;i<40;i++){
    const a = i/40*TAU + G.t*0.05;
    const r0 = 0.5, r1 = 0.5 + 0.028 + 0.02*Math.sin(G.t*2 + i);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*tw*r0, Math.sin(a)*th*r0);
    ctx.lineTo(Math.cos(a)*tw*r1, Math.sin(a)*th*r1);
    ctx.stroke();
  }
  // вензеля-воспоминания о прошлых раздачах
  ctx.save(); ctx.clip();
  for (let i=0;i<18;i++){
    const px = (nz('mem', i)*2-1)*tw*0.46, py = (nz('mem2', i)*2-1)*th*0.42;
    const s = (12 + nz('mem3', i)*26)*U;
    const al = 0.05 + 0.1*Math.abs(Math.sin(G.t*0.4 + i*1.7));
    ctx.save(); ctx.translate(px, py); ctx.rotate(nz('mem4', i)*TAU + G.t*0.02);
    ctx.strokeStyle = rgba(220, 255, 240, al); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.rect(-s/2, -s*0.7, s, s*1.4); ctx.stroke();
    if (i % 3 === 0){ glyphTooth(0, 0, s*0.5, rgba(255, 240, 240, al*1.4)); }
    else { ctx.beginPath(); ctx.arc(0, 0, s*0.3, 0, TAU); ctx.stroke(); }
    ctx.restore();
  }
  // лужа света от лампы
  const pl = ctx.createRadialGradient(0, -th*0.1, 10, 0, -th*0.1, tw*0.4);
  pl.addColorStop(0, rgba(220, 255, 240, 0.14)); pl.addColorStop(1, rgba(0,0,0,0));
  ctx.fillStyle = pl; ctx.fillRect(-tw, -th, tw*2, th*2);
  ctx.restore();
  ctx.restore();
  if (G.scene !== 'title'){ drawPot(); drawChips(); }
}
function drawPot(){
  const p = L.pot, n = Math.min(26, Math.round(G.pot/4));
  txt('БАНК', p.x, p.y - 34*U, 11*U, rgba(200, 240, 230, 0.5), 'center', F_MONO);
  txt(G.pot + ' зубов', p.x, p.y - 20*U, 20*U, '#f4f1e4', 'center', F_SERIF, 0.95);
  for (let i=0;i<n;i++){
    const a = nz('pot', i)*TAU, r = nz('pot2', i)*Math.min(L.tw*0.14, 70*U);
    const x = p.x + Math.cos(a)*r, y = p.y + 12*U + Math.sin(a)*r*0.4;
    glyphTooth(x, y, (8 + nz('pot3', i)*5)*U, rgba(244, 241, 228, 0.75 + 0.2*Math.sin(G.t + i)));
  }
  if (G.pot > 0 && chance(0.02)) { A.tooth(); }
}
function drawChips(){
  G.players.forEach((p, i) => {
    if (!L || !L.chip[i]) return;
    const at = L.chip[i];
    const n = Math.min(20, Math.round(p.chips/6));
    for (let k=0;k<n;k++){
      const jx = (k%7)*11*U + nz('cj'+i, k)*4*U, jy = Math.floor(k/7)*11*U + nz('cj2'+i, k)*3*U;
      glyphTooth(at.x - 34*U + jx, at.y + jy, (7 + nz('cj3'+i, k)*3)*U,
                 p.busted ? rgba(120,120,120,0.4) : rgba(244, 241, 228, 0.62));
    }
    txt(p.name, at.x, at.y + 34*U, 11*U, rgba(210, 240, 230, 0.8), 'center', F_MONO);
    txt(p.chips + ' з.', at.x, at.y + 50*U, 14*U, p.you ? '#ffdc6a' : rgba(244,241,228,0.9), 'center', F_SERIF);
    if (G.bet[i] > 0 && !G.folded[i] && G.scene === 'hand'){
      txt('+' + G.bet[i], at.x, at.y - 24*U, 13*U, '#8dff9e', 'center', F_MONO);
    }
  });
}

/* ---------- 21. МОТЫЛЁК-ДИЛЕР ---------- */
function drawDealer(){
  const d = L.dealer, t = G.t, dist = 1 - G.sanity/100;
  const flap = Math.sin(t*(4 + dist*4));
  const bob = Math.sin(t*1.3)*6*U;
  ctx.save(); ctx.translate(d.x, d.y + bob);
  const ws = 78*U;
  ctx.scale(1, 1);
  // пылевые чешуйки
  for (let i=0;i<14;i++){
    const a = t*0.6 + i, rr = (26 + i*4)*U;
    ctx.fillStyle = rgba(220, 235, 255, 0.06 + 0.05*Math.abs(Math.sin(t + i)));
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a*1.3)*rr*0.4 - 10*U, 2*U, 0, TAU); ctx.fill();
  }
  // крылья
  for (const s of [-1, 1]){
    ctx.save(); ctx.scale(s, 1);
    ctx.translate(0, -6*U);
    ctx.rotate(flap*0.16);
    const wg = ctx.createLinearGradient(0, 0, ws, -ws*0.5);
    wg.addColorStop(0, '#5b6a86'); wg.addColorStop(0.5, '#8f9ec2'); wg.addColorStop(1, '#2b3446');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(ws*0.75, -ws*0.85, ws*1.0, -ws*0.1);
    ctx.quadraticCurveTo(ws*0.92, ws*0.35, ws*0.32, ws*0.3);
    ctx.quadraticCurveTo(ws*0.1, ws*0.2, 0, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(255, 200, 120, 0.35); ctx.lineWidth = 1.2;
    for (let k=0;k<5;k++){
      ctx.beginPath(); ctx.moveTo(ws*0.08, -ws*0.02);
      ctx.quadraticCurveTo(ws*0.5, -ws*0.5 + k*ws*0.16, ws*(0.75 + k*0.04), -ws*0.1 + k*ws*0.1); ctx.stroke();
    }
    // глазок на крыле
    ctx.fillStyle = rgba(255, 240, 200, 0.5);
    ctx.beginPath(); ctx.arc(ws*0.62, -ws*0.12, ws*0.09, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0b0d12';
    ctx.beginPath(); ctx.arc(ws*0.62, -ws*0.12, ws*0.045, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // сюртук
  ctx.fillStyle = '#0d1118';
  ctx.beginPath();
  ctx.moveTo(-22*U, -14*U); ctx.lineTo(22*U, -14*U); ctx.lineTo(28*U, 58*U);
  ctx.quadraticCurveTo(0, 72*U, -28*U, 58*U); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e9eef2';
  ctx.beginPath(); ctx.moveTo(-8*U, -12*U); ctx.lineTo(8*U, -12*U); ctx.lineTo(5*U, 52*U); ctx.lineTo(-5*U, 52*U); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1f2b';
  ctx.beginPath(); ctx.moveTo(-9*U, -13*U); ctx.lineTo(0, 4*U); ctx.lineTo(-2*U, -13*U); ctx.closePath();
  ctx.moveTo(9*U, -13*U); ctx.lineTo(0, 4*U); ctx.lineTo(2*U, -13*U); ctx.closePath(); ctx.fill();
  // бабочка
  ctx.fillStyle = '#ff5f87';
  ctx.beginPath(); ctx.ellipse(0, -10*U, 12*U, 5*U, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -10*U, 3*U, 0, TAU); ctx.fill();
  // тело моли
  ctx.fillStyle = '#4a3f36';
  ctx.beginPath(); ctx.ellipse(0, 8*U, 12*U, 26*U, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(200, 180, 150, 0.5); ctx.lineWidth = 1;
  for (let k=0;k<5;k++){ ctx.beginPath(); ctx.moveTo(-11*U, 2*U + k*8*U); ctx.lineTo(11*U, 2*U + k*8*U); ctx.stroke(); }
  // голова + составные глаза
  ctx.fillStyle = '#6b5c4c';
  ctx.beginPath(); ctx.arc(0, -20*U, 13*U, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#4a3f36'; ctx.lineWidth = 2*U;
  for (const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(s*6*U, -30*U);
    ctx.quadraticCurveTo(s*20*U, -46*U, s*(26 + 4*Math.sin(t*2))*U, -34*U + Math.sin(t*2.4)*4*U); ctx.stroke();
  }
  for (const s of [-1,1]){
    const eg = ctx.createRadialGradient(s*6*U, -22*U, 1, s*6*U, -22*U, 8*U);
    eg.addColorStop(0, '#c9f5ff'); eg.addColorStop(0.4, '#2b6a8a'); eg.addColorStop(1, '#05121a');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.ellipse(s*6.5*U, -21*U, 7*U, 8*U, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(255,255,255,0.7);
    ctx.beginPath(); ctx.arc(s*4.5*U, -24*U, 1.6*U, 0, TAU); ctx.fill();
  }
  // хоботок
  ctx.strokeStyle = '#3b322a'; ctx.lineWidth = 2.4*U;
  ctx.beginPath(); ctx.moveTo(0, -14*U);
  ctx.quadraticCurveTo(6*U, -4*U + Math.sin(t*3)*3*U, 0, 2*U + Math.sin(t*2.6)*4*U); ctx.stroke();
  // колода в крыле
  ctx.save(); ctx.translate(30*U, 24*U); ctx.rotate(Math.sin(t*1.7)*0.15);
  ctx.fillStyle = '#e8e4d6'; rrect(-10*U, -3*U, 20*U, 26*U, 3); ctx.fill();
  ctx.fillStyle = '#2a3b4a'; rrect(-10*U, -3*U, 20*U, 4*U, 2); ctx.fill();
  ctx.restore();
  txt('Игорь Николаевич', 0, 78*U, 12*U, rgba(220, 240, 250, 0.6), 'center', F_MONO);
  ctx.restore();
}

/* ---------- 22. СОСЕДИ И ТЫ ---------- */
function drawZoya(){
  const p = G.players[1]; if (p.busted) return drawGhost(L.body[1].x, L.body[1].y, 'ЗЮ');
  const x = L.body[1].x, y = L.body[1].y, t = G.t;
  ctx.save(); ctx.translate(x, y);
  // плечи/шаль
  ctx.fillStyle = '#3a2038';
  ctx.beginPath();
  ctx.moveTo(-52*U, 78*U); ctx.quadraticCurveTo(-58*U, 4*U, -18*U, -14*U);
  ctx.lineTo(18*U, -14*U); ctx.quadraticCurveTo(58*U, 4*U, 52*U, 78*U); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(255, 95, 135, 0.35); ctx.lineWidth = 1.5;
  for (let k=0;k<6;k++){ ctx.beginPath();
    ctx.moveTo(-46*U + k*4*U, 74*U); ctx.quadraticCurveTo(0, 30*U + k*6*U, 46*U - k*4*U, 74*U); ctx.stroke(); }
  // голова
  ctx.fillStyle = '#d9c3b4';
  ctx.beginPath(); ctx.arc(0, -40*U, 24*U, 0, TAU); ctx.fill();
  // платок
  ctx.fillStyle = '#7a2f4a';
  ctx.beginPath(); ctx.moveTo(-26*U, -44*U); ctx.quadraticCurveTo(0, -76*U, 26*U, -44*U);
  ctx.quadraticCurveTo(0, -54*U, -26*U, -44*U); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-26*U, -44*U); ctx.lineTo(-40*U, -20*U); ctx.lineTo(-20*U, -34*U); ctx.closePath();
  ctx.moveTo(26*U, -44*U); ctx.lineTo(40*U, -20*U); ctx.lineTo(20*U, -34*U); ctx.closePath(); ctx.fill();
  // глаза: блик + слежка за тобой
  const look = clamp((G.sanity < 40 ? Math.sin(t*4) : Math.sin(t*0.6))*3, -3, 3);
  for (const s of [-1,1]){
    ctx.fillStyle = '#f5f2ea'; ctx.beginPath(); ctx.ellipse(s*9*U, -42*U, 6*U, 4.2*U, 0, 0, TAU); ctx.fill();
    const blink = Math.abs(Math.sin(t*0.7 + (s>0?0:1.2))) > 0.94 ? 0.1 : 1;
    ctx.fillStyle = '#2b3a44'; ctx.beginPath(); ctx.arc(s*9*U + look*U, -42*U, 2.6*U*blink, 0, TAU); ctx.fill();
  }
  // рот: шепчет или шевелит челюстью
  ctx.strokeStyle = '#8a4a4a'; ctx.lineWidth = 2*U;
  const mo = p.talkT > 0 ? 4*U + Math.abs(Math.sin(t*11))*5*U : 2*U;
  ctx.beginPath(); ctx.ellipse(0, -30*U, 6*U, mo*0.5, 0, 0, TAU); ctx.stroke();
  // очки-половинки
  ctx.strokeStyle = rgba(230, 240, 250, 0.5); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(-9*U, -42*U, 8*U, 0.3, Math.PI-0.3); ctx.arc(9*U, -42*U, 8*U, 0.3, Math.PI-0.3); ctx.stroke();
  // спицы + вязание
  const kn = Math.sin(t*3.2)*8*U;

function drawYou(){

    ctx.fillStyle = '#dcc6b6';

      const lift = Math.abs(Math.sin(t*1.5 + k*0.9 + (s>0?1.4:0))) * (4 + dist*7) * U;

      ctx.beginPath(); ctx.moveTo(px - 3*U, -14*U - lift); ctx.lineTo(px + 3*U, -14*U - lift); ctx.stroke();
    }

    ctx.fillStyle = '#dcc6b6';

  ctx.fillStyle = rgba(90, 200, 170, 0.04);
  ctx.fillRect(0, by - 20*U, W, H);

/* ---------- 23. КАРТЫ ---------- */
function cardSlot(c){
  if (c.owner >= 0){
    const p = G.players[c.owner], k = p.cards.indexOf(c);
    if (c.owner === 0){
      const s = L.you[Math.min(k, 1)];
      return { x: s.x + (k > 1 ? k*L.CW*0.6 : 0), y: s.y, rot: (k - 0.5)*0.12 };
    }
    const base = c.owner === 1 ? L.left : L.right;
    return { x: base.x + k*L.CW*0.55, y: base.y + k*4*U, rot: (c.owner === 1 ? -0.25 : 0.25) + (k - 0.5)*0.1 };
  }
  const bi = G.board.indexOf(c);
  if (bi >= 0){
    const s = L.board[Math.min(bi, 4)];
    return { x: s.x + (bi > 4 ? (bi-4)*L.CW*0.3 : 0), y: s.y - (bi > 4 ? 12*U : 0), rot: wob(bi, G.t*0.5, 0.03) };
  }
  return { x: L.dealer.x + 40*U, y: L.dealer.y + 60*U, rot: 0 };
}
function drawCard(c, dt){
  const w = L.CW, h = L.CH;
  const sel = (c.owner === 0 && G.sel === G.players[0].cards.indexOf(c) && G.players[0].cards[G.sel] === c);
  const dist = 1 - G.sanity/100;
  const m = mem(c);
  ctx.save();
  ctx.translate(c.x + w/2, c.y + h/2);
  ctx.rotate(c.rot + wob(c.ph, G.t*(1 + dist*3), 0.02 + dist*0.05));
  const pulse = 1 + (c.glow > 0 ? Math.sin(G.t*12)*0.02*c.glow : 0);
  ctx.scale(c.sc*pulse, c.sc*pulse);
  ctx.translate(-w/2, -h/2);
  // аура
  if (c.glow > 0.02 || sel || c.bite){
    ctx.save();
    ctx.shadowColor = c.bite > 0 ? '#ff2b4d' : (sel ? '#ffdc6a' : SUITS[c.s].c);
    ctx.shadowBlur = (14 + 26*Math.max(c.glow, sel ? 0.8 : 0) + c.bite*10) * U;
    ctx.fillStyle = rgba(255,255,255,0.001); rrect(0, 0, w, h, 7*U); ctx.fill();
    ctx.restore();
  }
  if (!c.up){
    // рубашка: мокрый глаз
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#12313c'); bg.addColorStop(0.5, '#0a1d26'); bg.addColorStop(1, '#142f3a');
    ctx.fillStyle = bg; rrect(0, 0, w, h, 7*U); ctx.fill();
    ctx.strokeStyle = rgba(120, 200, 220, 0.35); ctx.lineWidth = 1.2;
    rrect(3*U, 3*U, w-6*U, h-6*U, 5*U); ctx.stroke();
    ctx.save(); ctx.beginPath(); rrect(0, 0, w, h, 7*U); ctx.clip();
    ctx.strokeStyle = rgba(180, 240, 255, 0.18);
    for (let k=0;k<8;k++){ ctx.beginPath(); ctx.arc(w/2, h/2, (4 + k*3)*U, 0, TAU); ctx.stroke(); }
    ctx.fillStyle = rgba(255, 95, 135, 0.5);
    ctx.beginPath(); ctx.ellipse(w/2 + wob(c.ph, G.t, 2*U), h/2, 5*U, 9*U, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else {
    // лицо карты
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#f6f3e7'); bg.addColorStop(1, '#d9d5c2');
    ctx.fillStyle = bg; rrect(0, 0, w, h, 7*U); ctx.fill();
    ctx.strokeStyle = rgba(20, 30, 34, 0.25); ctx.lineWidth = 1; rrect(0.5, 0.5, w-1, h-1, 7*U); ctx.stroke();
    ctx.save(); ctx.beginPath(); rrect(0, 0, w, h, 7*U); ctx.clip();
    // фон по масти
    ctx.fillStyle = SUITS[c.s].dark; ctx.globalAlpha = 0.07; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;
    const S = SUITS[c.s], gl = GLYPH[c.s];
    const rankStr = RSHORT[c.r];
    // угловые номиналы
    txt(rankStr, w*0.16, h*0.15, h*0.2, S.c, 'center', F_SERIF, 1, 0, rgba(0,0,0,0.2));
    txt(rankStr, w*0.84, h*0.85, h*0.2, S.c, 'center', F_SERIF, 1, Math.PI);
    gl(w*0.16, h*0.3, h*0.1, S.c);
    gl(w*0.84, h*0.7, h*0.1, S.c);
    // центральная сцена
    gl(w/2, h/2, h*0.42, S.c);
    // мимика: карты чувствуют
    ctx.strokeStyle = rgba(10, 14, 16, 0.55); ctx.lineWidth = 1.4*U;
    const ey = h*0.44, mx = w/2;
    ctx.beginPath(); ctx.arc(mx - w*0.1, ey, 2.2*U, 0, TAU); ctx.arc(mx + w*0.1, ey, 2.2*U, 0, TAU); ctx.stroke();
    ctx.beginPath();
    if (m.grudge > 3) ctx.moveTo(mx - w*0.12, h*0.6), ctx.quadraticCurveTo(mx, h*0.52, mx + w*0.12, h*0.6);
    else if (m.love > 2) ctx.moveTo(mx - w*0.12, h*0.56), ctx.quadraticCurveTo(mx, h*0.66, mx + w*0.12, h*0.56);
    else ctx.moveTo(mx - w*0.1, h*0.58), ctx.lineTo(mx + w*0.1, h*0.58);
    ctx.stroke();
    // обида: трещины и кровь
    if (m.grudge > 1.5){
      ctx.strokeStyle = rgba(120, 10, 30, Math.min(0.8, 0.2 + m.grudge*0.08)); ctx.lineWidth = 1.3*U;
      for (let k=0;k<Math.min(6, Math.floor(m.grudge));k++){
        const a = nz('cr', c.uid*7 + k)*TAU;
        ctx.beginPath(); ctx.moveTo(w/2, h/2);
        ctx.lineTo(w/2 + Math.cos(a)*w*0.6, h/2 + Math.sin(a)*h*0.6); ctx.stroke();
      }
    }
    if (c.bite){ ctx.fillStyle = rgba(255, 40, 70, 0.16 + 0.1*Math.sin(G.t*8)); ctx.fillRect(0, 0, w, h); }
    // поцелуй
    if (c.kissed){
      ctx.fillStyle = rgba(255, 95, 135, 0.75);
      ctx.beginPath(); ctx.arc(w*0.66, h*0.24, 4*U, 0, TAU); ctx.arc(w*0.76, h*0.27, 3.4*U, 0, TAU); ctx.fill();
    }
    // дрейф ранга: старый номинал улетает, новый влетает
    if (c.slide > 0){
      const o = c.slide;
      ctx.globalAlpha = o;
      txt(rankStr, w/2, h/2 - (1-o)*h*0.6, h*0.34, '#ff5f87', 'center', F_SERIF, o);
      ctx.globalAlpha = 1;
      txt(RSHORT[c.slideTo], w/2, h/2 + o*h*0.5, h*0.34, '#8dff9e', 'center', F_SERIF, 1 - o);
    }
    ctx.restore();
    // «дышит» — кромка колышется при низкой психее
    if (dist > 0.45){
      ctx.strokeStyle = rgba(255, 220, 106, (dist - 0.45)*0.9); ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i=0;i<=20;i++){
        const px = i/20*w, py = h - Math.sin(i*0.7 + G.t*5)*dist*3*U;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.stroke();
    }
  }
  // выделение
  if (sel){
    ctx.strokeStyle = '#ffdc6a'; ctx.lineWidth = 2.4*U; ctx.setLineDash([6*U, 5*U]);
    ctx.lineDashOffset = -G.t*22;
    rrect(-4*U, -4*U, w+8*U, h+8*U, 9*U); ctx.stroke(); ctx.setLineDash([]);
    txt('ВЫБРАНО', w/2, -12*U, 10*U, '#ffdc6a', 'center', F_MONO);
  }
  ctx.restore();
  // частицы поцелуя/свечения
  if (c.glow > 0.02 && chance(0.25)) burst(c.x + w*rnd(0.2,0.8), c.y + h*rnd(0.2,0.8), 1, SUITS[c.s].c, 24, 0.6);
}
function drawAllCards(){
  const put = (c) => {
    const s = cardSlot(c);
    c.tx = s.x; c.ty = s.y; c.trot = s.rot;
    if (G.t >= c.born){
      c.x = lerp(c.x, c.tx, Math.min(1, 0.18)); c.y = lerp(c.y, c.ty, Math.min(1, 0.18));
    } else { c.x = L.dealer.x; c.y = L.dealer.y + 40*U; }
    c.rot = lerp(c.rot, c.trot, 0.12);
    c.sc = lerp(c.sc, c.tsc, 0.2);
    c.glow = Math.max(0, c.glow - 0.02);
    c.bite = Math.max(0, c.bite - 0.004);
    if (c.slide > 0) c.slide = Math.max(0, c.slide - 0.05);
  };
  G.board.forEach(put);
  G.players.forEach(p => p.cards.forEach(put));
  G.board.forEach(c => drawCard(c));
  G.players.forEach(p => p.cards.forEach(c => drawCard(c)));
}

/* ---------- 24. HUD ---------- */
function drawHUD(){
  const dist = 1 - G.sanity/100;

  const topH = 66*U;
  ctx.fillStyle = rgba(4, 10, 12, 0.72); ctx.fillRect(0, 0, W, topH);

  ctx.fillStyle = hg;
  const lh = bh*fill;
  ctx.beginPath();
  ctx.moveTo(bx, by + bh - lh);
  for (let i=0;i<=12;i++){ const px = bx + i/12*bw; ctx.lineTo(px, by + bh - lh + Math.sin(i*0.9 + G.t*3)*2*U*(1+dist*3)); }
  ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx, by + bh); ctx.closePath(); ctx.fill();
  txt('ПСИХЕЯ', bx + bw/2, by - 14*U, 10*U, rgba(230, 250, 240, 0.75), 'center', F_MONO);
  txt(G.sanity.toFixed(0), bx + bw/2, by + bh/2, 13*U, '#0b1114', 'center', F_MONO, 0.9);
  ctx.save(); ctx.translate(bx + bw/2, by + bh + 18*U);

  ctx.beginPath(); ctx.arc(0, 0, 10*U, 0, TAU); ctx.stroke();

  ctx.beginPath();
  if (fill > 0.55) ctx.moveTo(-4*U, 4*U), ctx.quadraticCurveTo(0, 7*U, 4*U, 4*U);
  else ctx.moveTo(-4*U, 6*U), ctx.quadraticCurveTo(0, 3*U, 4*U, 6*U);

  // чей ход
  if (G.scene === 'hand' && G.phase !== 'show' && G.phase !== 'end'){

      : (G.ai === 0 ? 'ХОД ТВОЙ' : 'ДУМАЕТ ' + G.players[G.ai].name);
    txt(turnTxt, L.cx, L.py - 56*U, 13*U, G.ai === 0 ? '#ffdc6a' : rgba(150, 220, 210, 0.8), 'center', F_MONO, 0.92);
    if (G.ai === 0 && !G.folded[0]){
      const w = 90*U + Math.sin(G.t*4)*10*U;
      ctx.strokeStyle = rgba(255, 220, 106, 0.5); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(L.cx, L.py + L.CH*0.5, w, L.CH*0.72, 0, 0, TAU); ctx.stroke();

function wrapWith(s, maxW, size){
  ctx.font = size + 'px ' + F_MONO;
  const words = String(s).split(' '), out = []; let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out.slice(0, 4);
}

function drawOverlays(dt){

  for (let y=0; y<H; y+=3){ ctx.fillStyle = '#000'; ctx.fillRect(0, y, W, 1); }

    ctx.fillStyle = rgba(255, 255, 255, 0.03 + 0.05*dist); ctx.fillRect(x, y, 2, 2);
  }
  // глитч: смещение полос + цветные полосы
  if (G.glitch > 0.04){
    const n = 2 + Math.floor(G.glitch*12);
    for (let i=0;i<n;i++){
      const y = rnd(H), hh = rnd(8, 46), dx = rnd(-1, 1)*26*G.glitch;
      ctx.drawImage(cv, 0, y*DPR, cv.width, hh*DPR, dx, y, W, hh);

      ctx.fillRect(0, y, W, hh);

      ctx.fillStyle = rgba(255, 220, 106, 0.06);
      ctx.fillRect(0, rnd(H), W, rnd(3, 18));
    }
  }
  // хроматическая аберрация при низкой психее: сдублировать кадр с tint
  if (dist > 0.35){
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = (dist - 0.35)*0.5;
    ctx.drawImage(cv, (-4 - dist*10)*DPR, 0, cv.width, cv.height, -4 - dist*10, 0, W, H);
    ctx.drawImage(cv, (4 + dist*10)*DPR, 0, cv.width, cv.height, 4 + dist*10, 0, W, H);

  // флеш
  if (G.flash > 0.01){ ctx.fillStyle = rgba(255, 255, 255, G.flash*0.5); ctx.fillRect(0, 0, W, H); }
  // большая галлюцинация
  if (dist > 0.55 && chance(0.004 + dist*0.01)){

    } else if (G.halluc.kind === 1){
      for (let k=0;k<9;k++) glyphTooth(hx - s*0.6 + k*s*0.15, hy + Math.sin(k)*s*0.1, s*0.14, rgba(244, 241, 228, 0.8));
    } else {

      for (let k=0;k<5;k++){ ctx.beginPath();
        ctx.moveTo(hx - s + k*s*0.5, hy - s*0.4); ctx.quadraticCurveTo(hx, hy + k*12, hx + s - k*s*0.5, hy - s*0.4); ctx.stroke(); }

    ctx.restore();

  // виньетка

      const c = G.players[0].cards[k];
      if (G.sel === k){ c.glow = 1.4; A.tone(520 + c.r*30, 0.12, 'triangle', 0.08); }
      if (mem(c).grudge > 3 && chance(0.4)){ say(0, 'Эта карта меня помнит. Плохо помнит.', 2); sanity(-3, 'она помнит'); }
      return;
    }
  }
  // клик по комнате
  if (G.scene === 'hand' && chance(0.5)){
    logIt('ТЫ ТРОГАЕШЬ КОМНАТУ: ' + pick(WHISPERS), 'whisper');
    burst(p.x, p.y, 8, '#7ff0d0', 60, 0.7); A.hum(ri(0,9));
    if (chance(0.15)) glitchIt(0.5);
  }
}
function onMove(e){
  const p = pointer(e); mx = p.x; my = p.y;
  hoverBtn = hitBtn(p.x, p.y);
  cv.style.cursor = (hoverBtn >= 0 && L.btn[hoverBtn].en) ? 'pointer' : 'crosshair';
}
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k >= '1' && k <= '6'){ const i = +k - 1; if (L && L.btn[i] && L.btn[i].en) press(L.btn[i].id); }
  if (k === 'f') press('fold');
  if (k === ' ') { ev.preventDefault(); press('call'); }
  if (k === 'r') press('raise');
  if (k === 'к' || k === 'c') press('kiss');
  if (k === 'м' || k === 'b') press('feed');
  if (k === 'm') A.set(!A.on);
  if (k === 'enter' && (G.scene === 'title')) press('start');
});

/* ---------- 29. СТАРТ / СБРОС ---------- */
function beginGame(){
  for (let i=0;i<52;i++) MEM[i] = { grudge:0, love:0, folds:0, eaten:0, wins:0, lost:0, last:-1 };
  mkPlayers();
  G.sanity = 100; G.hand = 0; G.stats = { hands:0, wins:0, madness:0, bites:0 };
  G.log = []; G.bub = []; G.parts = []; G.tel = null; G.telQ = []; G.eyeQ = 0;
  G.scene = 'hand';
  layout();
  telegram('ДОБРО ПОЖАЛОВАТЬ В КАБИНЕТ №∞',
    'Садись. Анте — 5 зубов. У тебя 100. Кнопки: сбросить / уравнять / поднять / поцеловать карту / покормить стол. Клик по своей карте — выбрать. Правила меняются каждую раздачу. Это не баг, это стол.', '#ffdc6a');
  logIt('Ты сел. Стул был тёплым. Это плохой знак.', 'sys');
  A.bell();
  startHand();
}

/* ---------- 30. ОБНОВЛЕНИЕ ---------- */
let lastT = 0, idle = 0, driftClock = 0, heartClock = 0, leakClock = 0;
function update(dt){
  G.t += dt;
  runTimers();
  G.shake *= Math.pow(0.02, dt); G.glitch *= Math.pow(0.05, dt);
  G.flash = Math.max(0, G.flash - dt*2.2);
  G.drift = Math.max(0, G.drift - dt*0.6);
  G.lawFlash = Math.max(0, G.lawFlash - dt*1.2);
  if (G.tel){ G.tel.t += dt; if (G.tel.t > 3.6){ G.tel = null; pullTelegram(); } }
  G.bub.forEach(b => b.t += dt);
  G.bub = G.bub.filter(b => b.t < b.life);
  G.players.forEach(p => { p.talkT = Math.max(0, p.talkT - dt); });
  G.log.forEach(l => l.age += dt);
  if (G.log.length > 10) G.log.length = 10;
  for (let i=G.parts.length-1;i>=0;i--){
    const q = G.parts[i];
    q.t += dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 240*dt; q.rot += q.vr*dt;
    if (q.t > q.life) G.parts.splice(i, 1);
  }
  // сердце стола
  heartClock += dt;
  const beat = lerp(1.4, 0.48, 1 - G.sanity/100);
  if (heartClock > beat){ heartClock = 0; A.thump(G.sanity > 55); }
  // психея утекает сама
  if (G.scene === 'hand'){
    leakClock += dt;
    if (leakClock > 6){ leakClock = 0; sanity(-(G.f.sanityTax ? 1.6 : 0.8), null);
      if (G.sanity < 34 && chance(0.5)) logIt('ГОЛОС ИЗ ЛИНОЛЕУМА: ' + pick(WHISPERS), 'whisper'); }
    // карты дрейфуют сами, без спроса
    driftClock += dt;
    if (driftClock > (G.f.driftStorm ? 7 : 14)){ driftClock = 0; if (G.board.length) drift(1, 'стол переварил ранг'); }
    // если ты молчишь слишком долго — стол решает за тебя
    if (G.ai === 0 && !G.folded[0] && G.phase !== 'show' && G.phase !== 'end' && G.phase !== 'dealing'){
      idle += dt;
      if (idle > 26){
        idle = 0;
        logIt('СТОЛ РЕШАЕТ ЗА ТЕБЯ. Ты слишком долго смотрел на свои карты.', 'bad');
        telegram('ПРОТОКОЛ МОЛЧАНИЯ', 'Ты не ходил 26 секунд. Игорь Николаевич сделал выбор вместо тебя. Он всегда делает выбор вместо тебя.', '#b07bff');
        sanity(-5, 'решение приняли без тебя'); glitchIt(1);
        needCall() > 0 ? doAction(0, 'call') : doAction(0, 'check');
      }
    } else idle = 0;
  } else idle = 0;
}

/* ---------- 31. РЕНДЕР ---------- */
function render(dt){
  layout();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sh = G.shake;
  ctx.save();
  if (sh > 0.3){ ctx.translate(rnd(-sh, sh)*0.6, rnd(-sh, sh)*0.6); ctx.rotate(rnd(-sh, sh)*0.0006); }
  drawRoom(dt);
  drawTable();
  drawDealer();
  if (G.scene === 'title'){
    drawZoya(); drawAndry(); drawTitle();
  } else {
    drawZoya(); drawAndry(); drawYou();
    drawAllCards();
    drawPotTeeth();
    if (G.scene === 'hand') drawHUD();
    drawShowdown();
    drawParticles();
    drawTelegram();
    if (G.scene === 'over') drawEnd(false);
    if (G.scene === 'win') drawEnd(true);
  }
  ctx.restore();
  drawOverlays(dt);
}
function drawPotTeeth(){
  G.parts.forEach(q => {
    const a = clamp(1 - q.t/q.life, 0, 1);
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.globalAlpha = a;
    if (q.kind === 'tooth') glyphTooth(0, 0, q.r*2.4, q.col);
    else { ctx.fillStyle = q.col; ctx.fillRect(-q.r, -q.r, q.r*2, q.r*2); }
    ctx.restore();
  });
}
function drawParticles(){ /* частьца уже нарисованы в drawPotTeeth; здесь — только искрыlaws */ }
function drawShowdown(){
  if (G.phase !== 'show' || !G.result) return;
  const t = G.showT;
  G.result.forEach((s, i) => {
    const p = G.players[s.i];
    const at = i === 0 ? { x:L.cx, y:L.py - 74*U }
           : i === 1 ? { x:L.left.x + L.CW*0.5, y:L.left.y - 30*U }
           : { x:L.right.x + L.CW*0.5, y:L.right.y - 30*U };
    const win = i === 0;
    const a = clamp((t - i*0.25)*2, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    const label = s.e.name;
    ctx.font = 13*U + 'px ' + F_MONO;
    const w = ctx.measureText(label).width + 20*U;
    ctx.fillStyle = rgba(6, 12, 14, 0.8); rrect(at.x - w/2, at.y - 15*U, w, 30*U, 15*U); ctx.fill();
    ctx.strokeStyle = win ? '#ffdc6a' : rgba(180, 210, 200, 0.4); ctx.lineWidth = win ? 2 : 1;
    rrect(at.x - w/2, at.y - 15*U, w, 30*U, 15*U); ctx.stroke();
    txt(label, at.x, at.y, 13*U, win ? '#ffdc6a' : '#cfe0da', 'center', F_MONO);
    if (win){
      for (let k=0;k<7;k++){
        const ang = k/7*TAU + t;
        glyphTooth(at.x + Math.cos(ang)*(w*0.6), at.y + Math.sin(ang)*18*U, 6*U, rgba(255, 220, 106, 0.5));
      }
    }
    ctx.restore();
  });
  G.showT += 0.016;
}
/* ---------- 32. ЦИКЛ ---------- */
function frame(ts){
  const dt = Math.min(0.05, lastT ? (ts - lastT)/1000 : 0.016);
  lastT = ts;
  try { update(dt); render(dt); }
  catch(e){
    if (!window.__crash){ window.__crash = e; console.error('СТОЛ СЛОМАЛСЯ:', e); }
    try { G.glitch = 1.5; G.shake = 20; } catch(_){}
  }
  requestAnimationFrame(frame);
}
mkPlayers(); layout();
logIt('Кабинет №∞. Свободный стул смотрит на тебя.', 'sys');
requestAnimationFrame(frame);
</script>
